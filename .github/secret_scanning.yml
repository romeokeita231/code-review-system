# Zones exempted from secret scanning.
#
# The criterion is "this path carries external bytes" - a byte-for-byte upstream
# copy, or a verbatim quotation of a substantial fragment of one - not "a hit
# happened here". Vendored upstream benchmark data contains the client-side
# config values (Firebase web keys, test RSA keys) that public repositories
# already publish; rewriting those bytes would change `content_sha256` and break
# every archived run that cites the hash.
#
# Keeping the scope at "external bytes" is what keeps it honest: `src/`,
# `scripts/`, `configs/`, `docs/`, `tests/` and `AGENTS.md` stay scanned, and if
# a note of our own is ever needed under `research/`, it belongs in `docs/`
# instead - `research/` must stay external-bytes-only.
#
# This file is read from the default branch, and it only affects future pushes:
# alerts raised before it existed stay open until they are dismissed by hand.
# A build-time gate covers the same three zones from the inside - see
# `scripts/secret-gate.ts` (`npm run check:wiring`).
paths-ignore:
  - "datasets/**"
  - "research/**"
  - "artifacts/acceptance/**"
